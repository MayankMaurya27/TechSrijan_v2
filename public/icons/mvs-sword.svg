  <path d="M18 15.5 L22.8 11.2" stroke="#FFF1BA" stroke-width="0.8" />

  <!-- Lower Wing (Left) -->
  <path d="M15.5 18 L11 23 L9 21.8 L13.8 19 Z" fill="#B88A27" />
  <path d="M15.5 18 L11.2 22.8" stroke="#FFF1BA" stroke-width="0.8" />

  <!-- Guard Center Crest -->
  <circle cx="17.5" cy="17.5" r="3.2" fill="#D4A843" stroke="#050203" stroke-width="0.8" />

  <!-- EMERALD SAKURADITE CORE GEM -->
  <polygon points="17.5,15.2 19.8,17.5 17.5,19.8 15.2,17.5" fill="#00E676" stroke="#050203" stroke-width="0.6" />
  <polygon points="17.5,16 19,17.5 17.5,19 16,17.5" fill="#B9F6CA" />
  <circle cx="17.5" cy="17.5" r="0.6" fill="#FFFFFF" />
</svg>
