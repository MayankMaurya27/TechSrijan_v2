<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Website under construction." />
    <title>Website Under Construction</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="construction" aria-labelledby="construction-title">
      <canvas id="starfield" aria-hidden="true"></canvas>
      <section class="loader">
        <h1 id="construction-title" aria-label="Website under construction">
          <span>WEBSITE</span><span>UNDER</span><span>CONSTRUCTION</span><b aria-hidden="true">_</b>
        </h1>
        <div class="progress" role="progressbar" aria-label="Website construction in progress" aria-valuemin="0" aria-valuemax="100" aria-valuetext="In progress">
          <span></span>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
