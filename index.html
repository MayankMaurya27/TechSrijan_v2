<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b17" />
  <meta name="description" content="Website under construction." />
  <title>Website Under Construction</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Cinematic background image -->
  <div class="hero-bg" id="hero-bg" aria-hidden="true">
    <img src="assets/hero-banner.jpg" alt="" id="hero-img" draggable="false" />
  </div>

  <main class="construction" aria-labelledby="construction-title">
    <canvas id="blueprint" aria-hidden="true"></canvas>
    <canvas id="text-vapor" aria-hidden="true"></canvas>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <section class="title-block">
      <div class="corner-cuts" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1 id="construction-title" aria-label="Website under construction">
        <span class="website">WEBSITE</span>
        <span class="under">UNDER <b aria-hidden="true"></b></span>
        <span class="construction-word">CONSTRUCTION</span>
      </h1>
      <div class="measure" aria-hidden="true"><span></span><i></i><span></span></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
